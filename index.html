    <script>
      // ========== SPOTIFY AUTH — FRONTEND ==========

      let spotifyAuthWindow = null;
      let spotifyAuthInterval = null;

      function mostrarToast(type, message) {
        if (window.vestHubToast) {
          window.vestHubToast(type, message);
        } else {
          console.log('[Spotify ' + type + ']: ' + message);
        }
      }

      function conectarSpotify() {
        // Abrir popup de autenticação
        var authUrl = '/api/spotify/login';
        spotifyAuthWindow = window.open(authUrl, 'spotifyAuth', 'width=500,height=700,scrollbars=yes');

        // Monitorar fechamento do popup (Problema 5)
        spotifyAuthInterval = setInterval(function() {
          if (spotifyAuthWindow && spotifyAuthWindow.closed) {
            clearInterval(spotifyAuthInterval);
            // Verificar se o token chegou via localStorage (fallback)
            var token = localStorage.getItem('spotify_access_token');
            if (token) {
              onSpotifyConnected(token);
            } else {
              // Se não chegou, verificar se o usuário fechou manualmente
              console.log('Popup fechado sem token');
            }
            spotifyAuthWindow = null;
          }
        }, 500);

        // Escutar postMessage do popup
        window.addEventListener('message', handleSpotifyMessage, false);
      }

      function handleSpotifyMessage(event) {
        var data = event.data;
        if (!data) return;

        if (data.type === 'spotify_auth_success' || data.type === 'SPOTIFY_AUTH_SUCCESS') {
          // Token recebido via postMessage
          var token = data.access_token || data.token;
          var refresh = data.refresh_token;
          var expiresIn = data.expires_in || 3600;

          localStorage.setItem('spotify_access_token', token);
          if (refresh) localStorage.setItem('spotify_refresh_token', refresh);
          localStorage.setItem('spotify_expires_at', Date.now() + (expiresIn * 1000));

          onSpotifyConnected(token);
          window.removeEventListener('message', handleSpotifyMessage);

          // Fechar popup se ainda aberto
          if (spotifyAuthWindow && !spotifyAuthWindow.closed) {
            spotifyAuthWindow.close();
          }
        } else if (data.type === 'spotify_auth_error' || data.type === 'SPOTIFY_AUTH_ERROR') {
          mostrarToast('error', 'Erro: ' + (data.message || data.error));
          window.removeEventListener('message', handleSpotifyMessage);
          if (spotifyAuthWindow && !spotifyAuthWindow.closed) {
            spotifyAuthWindow.close();
          }
        }
      }

      function onSpotifyConnected(accessToken) {
        // Atualizar UI
        var statusEl = document.getElementById('spotify-status');
        if (statusEl) {
          statusEl.innerHTML = '<div class="pulse" style="width:8px;height:8px;border-radius:50%;background:#1DB954;display:inline-block;margin-right:6px;"></div><span>Conectado</span>';
          statusEl.style.background = 'rgba(29, 185, 84, 0.15)';
          statusEl.style.color = '#1DB954';
        }

        // Carregar playlists do usuário
        carregarPlaylistsUsuario(accessToken);

        mostrarToast('success', 'Spotify conectado com sucesso!');

        // Notificar componentes React caso estejam ativos
        window.dispatchEvent(new CustomEvent('spotify:connected', { detail: { token: accessToken } }));
      }

      // ========== CARREGAR PLAYLISTS DO USUÁRIO (CORRIGIDO) ==========
      function carregarPlaylistsUsuario(accessToken) {
        fetch('/api/spotify/minhas-playlists', {
          headers: { 'Authorization': 'Bearer ' + accessToken }
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.error) {
            mostrarToast('error', data.error);
            return;
          }

          var grid = document.getElementById('spotify-categories');
          if (!grid) return;

          // Limpar categorias existentes (opcional — comente se quiser manter as pré-definidas)
          // grid.innerHTML = '';

          // Adicionar separador "Minhas Playlists"
          var separador = document.createElement('div');
          separador.style.cssText = 'width:100%; font-size:11px; font-weight:600; color:#737373; text-transform:uppercase; letter-spacing:0.08em; padding:8px 0 4px; margin-top:8px;';
          separador.textContent = 'Minhas Playlists (' + data.total + ')';
          grid.appendChild(separador);

          // Adicionar cada playlist do usuário
          data.playlists.forEach(function(playlist) {
            var div = document.createElement('div');
            div.className = 'spotify-category';
            div.style.cssText = 'position:relative; padding-left:44px; cursor:pointer;';

            // Ícone de playlist
            var icon = document.createElement('div');
            icon.style.cssText = 'position:absolute; left:8px; top:50%; transform:translateY(-50%); width:28px; height:28px; border-radius:6px; overflow:hidden; background:#262626; display:flex; align-items:center; justify-content:center;';

            if (playlist.image) {
              var img = document.createElement('img');
              img.src = playlist.image;
              img.style.cssText = 'width:100%; height:100%; object-fit:cover;';
              icon.appendChild(img);
            } else {
              icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14" style="color:#737373;"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>';
            }
            div.appendChild(icon);

            // Nome da playlist + contador de faixas
            var label = document.createElement('span');
            label.textContent = playlist.name + ' (' + playlist.tracks_total + ')';
            div.appendChild(label);

            // Click — carregar músicas da playlist no player
            div.onclick = function() {
              // Trocar o embed para tocar a playlist
              var embed = document.getElementById('spotify-embed');
              if (embed) {
                embed.src = 'https://open.spotify.com/embed/playlist/' + playlist.id + '?utm_source=generator&theme=0';
              }

              // Atualizar now playing
              var npTrack = document.getElementById('np-track');
              if (npTrack) npTrack.textContent = playlist.name;

              var npDesc = document.getElementById('np-desc');
              if (npDesc) npDesc.textContent = playlist.description || (playlist.tracks_total + ' músicas • ' + playlist.owner);

              var badge = document.getElementById('np-badge');
              if (badge) {
                badge.textContent = 'Carregando...';
                setTimeout(function() { badge.textContent = 'Tocando'; }, 800);
              }

              // Marcar como ativa
              var todas = document.querySelectorAll('.spotify-category');
              for (var i = 0; i < todas.length; i++) { todas[i].classList.remove('active'); }
              div.classList.add('active');

              mostrarToast('success', 'Tocando: ' + playlist.name);
            };

            grid.appendChild(div);
          });
        })
        .catch(function(err) {
          console.error('Erro ao carregar playlists:', err);
          mostrarToast('error', 'Erro ao carregar suas playlists');
        });
      }

      // ========== CARREGAR MÚSICAS DE UMA PLAYLIST ESPECÍFICA ==========
      function carregarMusicasPlaylist(playlistId, playlistName) {
        var token = localStorage.getItem('spotify_access_token');

        fetch('/api/spotify/playlist-tracks?playlist_id=' + encodeURIComponent(playlistId), {
          headers: { 'Authorization': 'Bearer ' + token }
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.error) {
            mostrarToast('error', data.error);
            return;
          }

          // Abrir modal com a lista de músicas
          abrirModalMusicas(playlistName, data.musicas);
        })
        .catch(function(err) {
          console.error('Erro ao carregar faixas:', err);
          mostrarToast('error', 'Erro ao carregar músicas da playlist');
        });
      }

      // ========== MODAL DE MÚSICAS ==========
      function abrirModalMusicas(nomePlaylist, musicas) {
        // Criar modal se não existir
        var modalExistente = document.getElementById('modal-musicas');
        if (modalExistente) modalExistente.remove();

        var modal = document.createElement('div');
        modal.id = 'modal-musicas';
        modal.style.cssText = 'position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.7); display:flex; align-items:center; justify-content:center; z-index:1500; padding:24px; backdrop-filter:blur(4px); animation:fadeIn 0.2s ease;';

        var card = document.createElement('div');
        card.style.cssText = 'background:#1A1A1A; border:1px solid #262626; border-radius:20px; width:560px; max-width:100%; max-height:80vh; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 20px 60px rgba(0,0,0,0.5);';

        // Header
        var header = document.createElement('div');
        header.style.cssText = 'padding:20px 24px; border-bottom:1px solid #262626; display:flex; align-items:center; justify-content:space-between;';
        header.innerHTML = '<h3 style="font-size:18px; font-weight:700; color:#FAFAFA;">' + nomePlaylist + ' (' + musicas.length + ')</h3>';

        var closeBtn = document.createElement('button');
        closeBtn.style.cssText = 'width:36px; height:36px; border-radius:50%; border:none; background:#262626; color:#A3A3A3; cursor:pointer; display:flex; align-items:center; justify-content:center;';
        closeBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M18 6L6 18M6 6l12 12"/></svg>';
        closeBtn.onclick = function() { modal.remove(); };
        header.appendChild(closeBtn);
        card.appendChild(header);

        // Lista de músicas
        var lista = document.createElement('div');
        lista.style.cssText = 'padding:16px 24px; overflow-y:auto; flex:1;';

        musicas.forEach(function(musica, index) {
          var item = document.createElement('div');
          item.style.cssText = 'display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:8px; cursor:pointer; transition:all 0.15s; margin-bottom:4px;';

          item.onmouseenter = function() { item.style.background = '#262626'; };
          item.onmouseleave = function() { item.style.background = 'transparent'; };

          // Número
          var num = document.createElement('span');
          num.style.cssText = 'font-size:13px; color:#737373; width:24px; text-align:right; flex-shrink:0;';
          num.textContent = (index + 1);
          item.appendChild(num);

          // Capa do álbum
          var art = document.createElement('div');
          art.style.cssText = 'width:40px; height:40px; border-radius:6px; overflow:hidden; background:#262626; flex-shrink:0;';
          if (musica.image) {
            art.innerHTML = '<img src="' + musica.image + '" style="width:100%; height:100%; object-fit:cover;">';
          } else {
            art.style.display = 'flex';
            art.style.alignItems = 'center';
            art.style.justifyContent = 'center';
            art.style.color = '#737373';
            art.innerHTML = '♪';
          }
          item.appendChild(art);

          // Info
          var info = document.createElement('div');
          info.style.cssText = 'flex:1; min-width:0;';

          var nome = document.createElement('div');
          nome.style.cssText = 'font-size:14px; font-weight:500; color:#FAFAFA; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;';
          nome.textContent = musica.name;
          info.appendChild(nome);

          var artista = document.createElement('div');
          artista.style.cssText = 'font-size:12px; color:#A3A3A3; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;';
          artista.textContent = musica.artist + (musica.album ? ' — ' + musica.album : '');
          info.appendChild(artista);
          item.appendChild(info);

          // Duração
          var durMin = Math.floor(musica.duration_ms / 60000);
          var durSeg = Math.floor((musica.duration_ms % 60000) / 1000);
          var duracao = document.createElement('span');
          duracao.style.cssText = 'font-size:12px; color:#737373; flex-shrink:0;';
          duracao.textContent = durMin + ':' + (durSeg < 10 ? '0' : '') + durSeg;
          item.appendChild(duracao);

          // Click — tocar a música
          item.onclick = function() {
            // Trocar embed para a faixa específica
            var embed = document.getElementById('spotify-embed');
            if (embed) {
              embed.src = 'https://open.spotify.com/embed/track/' + musica.id + '?utm_source=generator&theme=0';
            }

            var npTrack = document.getElementById('np-track');
            if (npTrack) npTrack.textContent = musica.name;

            var npDesc = document.getElementById('np-desc');
            if (npDesc) npDesc.textContent = musica.artist + ' — ' + musica.album;

            var badge = document.getElementById('np-badge');
            if (badge) {
              badge.textContent = 'Carregando...';
              setTimeout(function() { badge.textContent = 'Tocando'; }, 800);
            }

            modal.remove();
            mostrarToast('success', 'Tocando: ' + musica.name);
          };

          lista.appendChild(item);
        });

        card.appendChild(lista);
        modal.appendChild(card);

        // Fechar ao clicar fora
        modal.onclick = function(e) {
          if (e.target === modal) modal.remove();
        };

        document.body.appendChild(modal);
      }

      function trocarPlaylistComId(playlistId, trackName, trackDesc) {
        var embed = document.getElementById('spotify-embed');
        if (embed) {
          embed.src = 'https://open.spotify.com/embed/playlist/' + playlistId + '?utm_source=generator&theme=0';
        }

        var trackEl = document.getElementById('np-track');
        if (trackEl) trackEl.textContent = trackName;

        var descEl = document.getElementById('np-desc');
        if (descEl) descEl.textContent = trackDesc;

        var badge = document.getElementById('np-badge');
        if (badge) {
          badge.textContent = 'Carregando...';
          setTimeout(function() { badge.textContent = 'Tocando'; }, 800);
        }

        mostrarToast('success', 'Playlist trocada: ' + trackName);
      }

      // Verificar token expirado e renovar automaticamente
      function verificarTokenSpotify() {
        var expiresAt = localStorage.getItem('spotify_expires_at');
        if (!expiresAt) return;

        // Se expira em menos de 5 minutos, renovar
        if (Date.now() > parseInt(expiresAt) - 300000) {
          var refreshToken = localStorage.getItem('spotify_refresh_token');
          if (refreshToken) {
            fetch('/api/spotify/refresh?refresh_token=' + encodeURIComponent(refreshToken))
              .then(function(r) { return r.json(); })
              .then(function(data) {
                if (data.access_token) {
                  localStorage.setItem('spotify_access_token', data.access_token);
                  localStorage.setItem('spotify_expires_at', Date.now() + (data.expires_in * 1000));
                }
              })
              .catch(function(err) { console.error('Erro ao renovar token:', err); });
          }
        }
      }

      // Verificar ao carregar a página
      verificarTokenSpotify();
      setInterval(verificarTokenSpotify, 60000); // a cada 1 minuto

      // Funções para estilos musicais e criação de playlist
      function listarEstilos() {
        return fetch('/api/spotify/estilos')
          .then(function(r) { return r.json(); });
      }

      function buscarPorEstilo(estiloId) {
        var token = localStorage.getItem('spotify_access_token');
        return fetch('/api/spotify/buscar-por-estilo?estilo=' + encodeURIComponent(estiloId), {
          headers: token ? { 'Authorization': 'Bearer ' + token } : {}
        }).then(function(r) { return r.json(); });
      }

      function criarPlaylist(nome, descricao, trackUris) {
        var token = localStorage.getItem('spotify_access_token');
        return fetch('/api/spotify/criar-playlist', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            ...(token ? { 'Authorization': 'Bearer ' + token } : {})
          },
          body: JSON.stringify({
            nome: nome,
            descricao: descricao,
            track_uris: trackUris,
            access_token: token
          })
        }).then(function(r) { return r.json(); });
      }

      // Exportar para escopo global
      window.conectarSpotify = conectarSpotify;
      window.trocarPlaylistComId = trocarPlaylistComId;
      window.carregarPlaylistsUsuario = carregarPlaylistsUsuario;
      window.carregarMusicasPlaylist = carregarMusicasPlaylist;
      window.abrirModalMusicas = abrirModalMusicas;
      window.verificarTokenSpotify = verificarTokenSpotify;
      window.listarEstilos = listarEstilos;
      window.buscarPorEstilo = buscarPorEstilo;
      window.criarPlaylist = criarPlaylist;
    </script>

    <script>
    // ========== CRIADOR DE PLAYLIST — ESTADO GLOBAL ==========
    var pcEstado = {
        estiloSelecionado: null,
        musicasEncontradas: [],
        musicasSelecionadas: {},
        userId: null
    };

    // ========== ABRIR / FECHAR MODAL ==========
    function abrirCriadorPlaylist() {
        var token = localStorage.getItem('spotify_access_token');
        if (!token) {
            mostrarToast('error', 'Conecte o Spotify primeiro!');
            return;
        }
        document.getElementById('playlist-creator').style.display = 'flex';
        carregarEstilos();
        obterUserId();
    }

    function fecharCriadorPlaylist() {
        document.getElementById('playlist-creator').style.display = 'none';
        resetarCriador();
    }

    function resetarCriador() {
        pcEstado = { estiloSelecionado: null, musicasEncontradas: [], musicasSelecionadas: {}, userId: null };
        document.getElementById('pc-step-1').style.display = 'block';
        document.getElementById('pc-step-2').style.display = 'none';
        document.getElementById('pc-step-3').style.display = 'none';
        document.getElementById('pc-step-4').style.display = 'none';
    }

    // ========== OBTER USER ID DO SPOTIFY ==========
    function obterUserId() {
        var token = localStorage.getItem('spotify_access_token');
        fetch('/api/spotify/me', {
            headers: { 'Authorization': 'Bearer ' + token }
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.id) {
                pcEstado.userId = data.id;
            }
        })
        .catch(function(err) { console.error('Erro ao obter perfil:', err); });
    }

    // ========== PASSO 1: CARREGAR ESTILOS ==========
    function carregarEstilos() {
        var grid = document.getElementById('pc-estilos-grid');
        var estilos = [
            { id: 'lofi', nome: 'Lo-Fi Beats', descricao: 'Batidas relaxantes para foco', icon: '🎧' },
            { id: 'classica', nome: 'Música Clássica', descricao: 'Concentração profunda', icon: '🎻' },
            { id: 'piano', nome: 'Piano Relaxante', descricao: 'Leitura e redação', icon: '🎹' },
            { id: 'jazz', nome: 'Jazz Suave', descricao: 'Manter o ritmo', icon: '🎷' },
            { id: 'eletronica', nome: 'Eletrônica Focus', descricao: 'Alta produtividade', icon: '⚡' },
            { id: 'ambient', nome: 'Ambient', descricao: 'Imersão total', icon: '🌌' },
            { id: 'rock', nome: 'Rock Instrumental', descricao: 'Manter energia', icon: '🎸' },
            { id: 'indie', nome: 'Indie Folk', descricao: 'Estudos tranquilos', icon: '🪕' },
            { id: 'hiphop', nome: 'Hip-Hop Beats', descricao: 'Manter o flow', icon: '🎤' },
            { id: 'bossa', nome: 'Bossa Nova', descricao: 'Relaxar estudando', icon: '🌴' }
        ];

        grid.innerHTML = '';
        estilos.forEach(function(estilo) {
            var div = document.createElement('div');
            div.className = 'pc-estilo-card';
            div.onclick = function() { selecionarEstilo(div, estilo); };
            div.innerHTML =
                '<span class="pc-estilo-emoji">' + estilo.icon + '</span>' +
                '<div class="pc-estilo-info">' +
                    '<div class="pc-estilo-nome">' + estilo.nome + '</div>' +
                    '<div class="pc-estilo-desc">' + estilo.descricao + '</div>' +
                '</div>' +
                '<div class="pc-estilo-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg></div>';
            grid.appendChild(div);
        });
    }

    // ========== SELECIONAR ESTILO ==========
    function selecionarEstilo(cardEl, estilo) {
        var todos = document.querySelectorAll('.pc-estilo-card');
        for (var i = 0; i < todos.length; i++) {
            todos[i].classList.remove('selected');
        }
        cardEl.classList.add('selected');
        pcEstado.estiloSelecionado = estilo;

        // Auto-avançar para passo 2
        setTimeout(function() { irPasso2(); }, 300);
    }

    // ========== PASSO 2: BUSCAR MÚSICAS ==========
    function irPasso2() {
        document.getElementById('pc-step-1').style.display = 'none';
        document.getElementById('pc-step-2').style.display = 'block';
        document.getElementById('pc-loading').style.display = 'flex';
        document.getElementById('pc-musicas-list').innerHTML = '';

        var token = localStorage.getItem('spotify_access_token');
        var estiloId = pcEstado.estiloSelecionado.id;

        fetch('/api/spotify/buscar-por-estilo?estilo=' + estiloId, {
            headers: { 'Authorization': 'Bearer ' + token }
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            document.getElementById('pc-loading').style.display = 'none';
            if (data.error) {
                mostrarToast('error', data.error);
                voltarPasso1();
                return;
            }
            pcEstado.musicasEncontradas = data.musicas;
            renderizarMusicas(data.musicas);
        })
        .catch(function(err) {
            document.getElementById('pc-loading').style.display = 'none';
            mostrarToast('error', 'Erro ao buscar músicas');
            voltarPasso1();
        });
    }

    function renderizarMusicas(musicas) {
        var lista = document.getElementById('pc-musicas-list');
        lista.innerHTML = '';

        musicas.forEach(function(musica) {
            pcEstado.musicasSelecionadas[musica.id] = true; // pré-selecionar todas

            var duracaoMin = Math.floor(musica.duration_ms / 60000);
            var duracaoSeg = Math.floor((musica.duration_ms % 60000) / 1000);
            var duracaoStr = duracaoMin + ':' + (duracaoSeg < 10 ? '0' : '') + duracaoSeg;

            var div = document.createElement('div');
            div.className = 'pc-musica-item selected';
            div.onclick = function() { toggleMusica(div, musica); };

            var imgHtml = musica.image
                ? '<img class="pc-musica-art" src="' + musica.image + '" alt="">'
                : '<div class="pc-musica-art" style="display:flex;align-items:center;justify-content:center;color:#737373;font-size:18px;">♪</div>';

            div.innerHTML =
                '<div class="pc-musica-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg></div>' +
                imgHtml +
                '<div class="pc-musica-info">' +
                    '<div class="pc-musica-nome">' + musica.name + '</div>' +
                    '<div class="pc-musica-artista">' + musica.artist + '</div>' +
                '</div>' +
                '<div class="pc-musica-duracao">' + duracaoStr + '</div>';
            lista.appendChild(div);
        });
    }

    function toggleMusica(el, musica) {
        el.classList.toggle('selected');
        pcEstado.musicasSelecionadas[musica.id] = el.classList.contains('selected');
    }

    // ========== NAVEGAÇÃO ENTRE PASSOS ==========
    function voltarPasso1() {
        document.getElementById('pc-step-2').style.display = 'none';
        document.getElementById('pc-step-1').style.display = 'block';
    }

    function irPasso3() {
        var selecionadas = pcEstado.musicasEncontradas.filter(function(m) {
            return pcEstado.musicasSelecionadas[m.id];
        });

        if (selecionadas.length === 0) {
            mostrarToast('error', 'Selecione pelo menos uma música');
            return;
        }

        document.getElementById('pc-step-2').style.display = 'none';
        document.getElementById('pc-step-3').style.display = 'block';

        // Pré-preencher nome
        var nomePadrao = 'Gabarita — ' + pcEstado.estiloSelecionado.nome;
        document.getElementById('pc-nome').value = nomePadrao;
        document.getElementById('pc-descricao').value = 'Playlist de estudo criada no Gabarita • ' + pcEstado.estiloSelecionado.nome;

        // Resumo
        document.getElementById('pc-resumo').innerHTML =
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>' +
            '<strong>' + selecionadas.length + '</strong> músicas selecionadas • Estilo: <strong>' + pcEstado.estiloSelecionado.nome + '</strong>';
    }

    function voltarPasso2() {
        document.getElementById('pc-step-3').style.display = 'none';
        document.getElementById('pc-step-2').style.display = 'block';
    }

    // ========== PASSO 4: CRIAR PLAYLIST FINAL ==========
    function criarPlaylistFinal() {
        var btn = document.getElementById('btn-criar-playlist');
        var nome = document.getElementById('pc-nome').value.trim();
        var descricao = document.getElementById('pc-descricao').value.trim();
        var token = localStorage.getItem('spotify_access_token');

        if (!nome) {
            mostrarToast('error', 'Digite um nome para a playlist');
            return;
        }

        if (!pcEstado.userId) {
            mostrarToast('error', 'Não foi possível obter seu ID do Spotify');
            return;
        }

        var trackUris = pcEstado.musicasEncontradas
            .filter(function(m) { return pcEstado.musicasSelecionadas[m.id]; })
            .map(function(m) { return m.uri; });

        if (trackUris.length === 0) {
            mostrarToast('error', 'Nenhuma música selecionada');
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<div class="pc-spinner" style="width:16px;height:16px;border-width:2px;"></div> Criando...';

        fetch('/api/spotify/criar-playlist', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                access_token: token,
                user_id: pcEstado.userId,
                nome: nome,
                descricao: descricao,
                track_uris: trackUris
            })
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            btn.disabled = false;
            btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M5 13l4 4L19 7"/></svg> Criar Playlist';

            if (data.error) {
                mostrarToast('error', data.error);
                return;
            }

            // Sucesso
            document.getElementById('pc-step-3').style.display = 'none';
            document.getElementById('pc-step-4').style.display = 'block';
            document.getElementById('pc-success-text').textContent =
                data.total_musicas + ' músicas adicionadas à playlist "' + data.nome + '"';
            document.getElementById('pc-success-link').href = data.playlist_url;

            mostrarToast('success', 'Playlist criada com sucesso!');
        })
        .catch(function(err) {
            btn.disabled = false;
            btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M5 13l4 4L19 7"/></svg> Criar Playlist';
            mostrarToast('error', 'Erro ao criar playlist');
        });
    }

    // Exportar funções para escopo global
    window.abrirCriadorPlaylist = abrirCriadorPlaylist;
    window.fecharCriadorPlaylist = fecharCriadorPlaylist;
    window.selecionarEstilo = selecionarEstilo;
    window.irPasso2 = irPasso2;
    window.irPasso3 = irPasso3;
    window.voltarPasso1 = voltarPasso1;
    window.voltarPasso2 = voltarPasso2;
    window.criarPlaylistFinal = criarPlaylistFinal;
    </script>

/* ============================================================
   DISCIPLINA ATUAL & PROGRESSO DE CONTEÚDO — gabarita

   ============================================================ */
window.DisciplinaAtual = {
  detectar: function(sugestao) {
    if (sugestao) return window.DisciplinaAtual.slug(sugestao);
    const el = document.querySelector('[data-disciplina]');
    if (el) {
      const v = el.getAttribute('data-disciplina');
      if (v) return window.DisciplinaAtual.slug(v);
    }
    if (window.disciplinaAtiva) return window.DisciplinaAtual.slug(window.disciplinaAtiva);
    return 'quimica';
  },
  slug: function(nome) {
    if (!nome) return 'geral';
    return String(nome)
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, '_')
      .replace(/^_+|_+$/g, '');
  }
};

window.Progresso = (() => {
  const CHAVE = 'gabarita_progresso_v1';

  // Peso de cada tipo de conteúdo dentro de um tema (soma 100)
  const PESOS = { resumo: 45, quiz: 35, mapa: 10, flashcards: 10 };

  const carregar = () => {
    try { return JSON.parse(localStorage.getItem(CHAVE)) || {}; }
    catch (e) { return {}; }
  };
  const salvar = (d) => { try { localStorage.setItem(CHAVE, JSON.stringify(d)); } catch (e) {} };

  function normalizar(disciplina, tema) {
    const dados = carregar();
    const dKey = window.DisciplinaAtual.slug(disciplina);
    const tKey = window.DisciplinaAtual.slug(tema);
    dados[dKey] = dados[dKey] || {};
    dados[dKey][tKey] = Object.assign(
      { resumo: 0, quiz: 0, mapa: 0, flashcards: 0 },
      dados[dKey][tKey] || {}
    );
    return dados;
  }

  /* Registra fração vista (0 a 1) de um tipo de conteúdo.
     Guarda sempre a MAIOR fração já alcançada — o progresso não regride. */
  function registrar(disciplina, tema, tipo, fracao) {
    if (!PESOS.hasOwnProperty(tipo)) return 0;
    const f = Math.max(0, Math.min(1, Number(fracao) || 0));
    const dKey = window.DisciplinaAtual.slug(disciplina);
    const tKey = window.DisciplinaAtual.slug(tema);
    const dados = normalizar(dKey, tKey);
    const atual = dados[dKey][tKey][tipo] || 0;
    if (f > atual) {
      dados[dKey][tKey][tipo] = f;
      salvar(dados);
    }
    renderizarPainelGeral();
    return percentualTema(dKey, tKey);
  }

  function percentualTema(disciplina, tema) {
    const dKey = window.DisciplinaAtual.slug(disciplina);
    const tKey = window.DisciplinaAtual.slug(tema);
    const t = normalizar(dKey, tKey)[dKey][tKey];
    let total = 0;
    for (const [tipo, peso] of Object.entries(PESOS)) {
      total += peso * Math.min(1, t[tipo] || 0);
    }
    return Math.round(total);
  }

  /* Progresso da MATÉRIA inteira = média dos temas já conhecidos */
  function percentualDisciplina(disciplina) {
    const dKey = window.DisciplinaAtual.slug(disciplina);
    const d = carregar()[dKey];
    if (!d) return 0;
    const temas = Object.keys(d);
    if (!temas.length) return 0;
    const soma = temas.reduce((acc, t) => acc + percentualTema(dKey, t), 0);
    return Math.round(soma / temas.length);
  }

  function renderizarPainelGeral() {
    const materias = ['portugues','matematica','fisica','quimica','biologia',
                      'historia','geografia','filosofia','sociologia','ingles','redacao'];
    const nomes = { portugues:'Português', matematica:'Matemática', fisica:'Física',
                    quimica:'Química', biologia:'Biologia', historia:'História',
                    geografia:'Geografia', filosofia:'Filosofia', sociologia:'Sociologia',
                    ingles:'Inglês', redacao:'Redação' };
    const container = document.getElementById('painel-progresso-geral');
    if (!container) return;
    container.innerHTML = materias.map((m) => {
      const pct = percentualDisciplina(m);
      return `<div class="linha-progresso" style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 12px;background:rgba(255,255,255,0.03);border-radius:10px;border:1px solid rgba(255,255,255,0.05)">
        <span class="nome-materia" style="font-size:12px;font-weight:700;color:#688cff;min-width:85px">${nomes[m]}</span>
        <div class="barra-progresso" style="flex:1;height:7px;background:rgba(255,255,255,0.1);border-radius:9999px;overflow:hidden;position:relative">
          <div class="barra-preenchida" style="width:${pct}%;height:100%;background:linear-gradient(90deg,#3b82f6,#6366f1);border-radius:9999px;transition:width 0.4s ease"></div>
        </div>
        <span class="barra-rotulo" style="font-size:11px;font-weight:800;color:#ffffff;min-width:35px;text-align:right;font-family:monospace">${pct}%</span>
      </div>`;
    }).join('');
  }

  /* Atualiza as barras e os rótulos da tela.
     Convenção: cada card tem data-tema="slug-do-tema",
     um elemento .barra-preenchida e um .barra-rotulo.
     O indicador circular da matéria tem data-disciplina-progresso. */
  function aplicarNaTela(disciplina) {
    const dKey = window.DisciplinaAtual.slug(disciplina);
    document.querySelectorAll('[data-tema]').forEach((card) => {
      const tema = card.getAttribute('data-tema');
      const cardDisc = card.getAttribute('data-disciplina') || dKey;
      const pct = percentualTema(cardDisc, tema);
      const barra = card.querySelector('.barra-preenchida');
      const rotulo = card.querySelector('.barra-rotulo');
      if (barra) barra.style.width = pct + '%';
      if (rotulo) rotulo.textContent = pct + '%';
    });
    document.querySelectorAll('[data-disciplina-progresso]').forEach((circ) => {
      const targetDisc = circ.getAttribute('data-disciplina-progresso') || dKey;
      const pct = percentualDisciplina(targetDisc);
      circ.textContent = pct + '%';
      if (circ.dataset.barra !== undefined) circ.style.width = pct + '%';
    });
    renderizarPainelGeral();
  }

  /* Reseta um tema (ex.: botão "zerar progresso") */
  function zerar(disciplina, tema) {
    const dKey = window.DisciplinaAtual.slug(disciplina);
    const tKey = window.DisciplinaAtual.slug(tema);
    const dados = normalizar(dKey, tKey);
    dados[dKey][tKey] = { resumo: 0, quiz: 0, mapa: 0, flashcards: 0 };
    salvar(dados);
    aplicarNaTela(dKey);
  }

  return { registrar, percentualTema, percentualDisciplina, aplicarNaTela, renderizarPainelGeral, zerar };
})();

/* ============================================================
   APLICADOR AUTOMÁTICO — funciona para todas as matérias
   Sempre que a página muda e existe um título de matéria,
   atualiza as barras e o indicador circular daquela matéria.
   ============================================================ */
(function aplicarProgressoAoNavegar() {
  let ultimaDisciplina = null;
  function tentar() {
    if (!window.DisciplinaAtual || !window.Progresso) return;
    const disciplina = window.DisciplinaAtual.detectar();
    if (disciplina) {
      if (disciplina !== ultimaDisciplina) {
        ultimaDisciplina = disciplina;
      }
      window.Progresso.aplicarNaTela(disciplina);
    }
    window.Progresso.renderizarPainelGeral();
  }
  document.addEventListener('DOMContentLoaded', tentar);
  setTimeout(tentar, 500);
})();
</script>
<script>
/* ============================================================
   CRONOGRAMA PERSONALIZÁVEL — gabarita
   O usuário edita, reordena, adiciona/exclui semanas,
   regenera semanas com IA e salva na sua conta.
   ============================================================ */
window.Cronograma = (() => {
  let semanas = [];
  // Sugestões para o campo de tópico (auxilia na digitação)
  const MATERIAS = ['Matemática','Física','Química','Biologia','História',
                    'Geografia','Português','Redação','Filosofia','Sociologia','Inglês'];

  async function carregar() {
    try {
      const headers = {};
      try {
        const sessao = localStorage.getItem('vestibularpro_session_user');
        if (sessao) {
          const u = JSON.parse(sessao);
          if (u.uid) headers['x-usuario-id'] = u.uid;
        }
      } catch (_) {}
      const r = await fetch('/api/cronograma', { headers });
      const d = await r.json();
      if (d.existe && Array.isArray(d.cronograma?.semanas)) return d.cronograma.semanas;
    } catch (e) {}
    try {
      const local = localStorage.getItem('cronograma_semanas_salvas');
      if (local) {
        const parsed = JSON.parse(local);
        if (Array.isArray(parsed) && parsed.length) return parsed;
      }
    } catch (_) {}
    return null;
  }

  async function carregarOuGerar() {
    const salvo = await carregar();
    if (salvo && salvo.length) {
      semanas = salvo;
      renderizar();
      return;
    }
    // Não existe ainda: gera o plano base com IA
    const botoes = document.querySelectorAll('#btn-abrir-cronograma');
    botoes.forEach(function(b) { b.textContent = 'Gerando cronograma...'; });
    try {
      const r = await fetch('/api/gemini/study-plan', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ weakSubjects: [], upcomingExams: [], weeks: 8 })
      });
      semanas = await r.json();
    } catch (e) {
      semanas = [];
    }
    botoes.forEach(function(b) { b.textContent = 'Meu Cronograma'; });
    renderizar();
  }

  function renderizar() {
    let modal = document.getElementById('modal-cronograma');
    if (!modal) {
      modal = document.createElement('div');
      modal.id = 'modal-cronograma';
      modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;';
      document.body.appendChild(modal);
    }
    modal.innerHTML = `
      <div style="background:#10141D;color:#fff;border-radius:16px;max-width:720px;width:100%;max-height:90vh;overflow-y:auto;padding:24px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <h2 style="font-size:20px;margin:0;">Meu Cronograma <span style="color:#60A5FA;">editável</span></h2>
          <button onclick="document.getElementById('modal-cronograma').style.display='none'"
                  style="background:none;border:none;color:#9E9E9E;font-size:22px;cursor:pointer;">✕</button>
        </div>
        <p style="color:#9E9E9E;font-size:13px;margin:0 0 16px;">Clique nos campos para editar, use ↑↓ para reordenar, + para adicionar semana, ⟳ para regenerar com IA.</p>
        <div id="lista-semanas">${semanas.map(linhaSemana).join('')}</div>
        <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;">
          <button onclick="Cronograma.adicionarSemana()" style="padding:10px 16px;border-radius:8px;border:1px solid #60A5FA;background:none;color:#60A5FA;cursor:pointer;">+ Adicionar semana</button>
          <button onclick="Cronograma.salvar()" style="padding:10px 20px;border-radius:8px;border:none;background:#1E3A8A;color:#fff;cursor:pointer;font-weight:600;">Salvar cronograma</button>
          <span id="status-cronograma" style="align-self:center;color:#1DB954;font-size:13px;"></span>
        </div>
      </div>`;
    modal.style.display = 'flex';
    // Liga eventos de edição e reordenação
    modal.querySelectorAll('[data-acao]').forEach((btn) => {
      btn.onclick = () => {
        const acao = btn.dataset.acao;
        const i = Number(btn.dataset.indice);
        if (acao === 'subir' && i > 0) { [semanas[i-1], semanas[i]] = [semanas[i], semanas[i-1]]; }
        if (acao === 'descer' && i < semanas.length - 1) { [semanas[i+1], semanas[i]] = [semanas[i], semanas[i+1]]; }
        if (acao === 'excluir') semanas.splice(i, 1);
        if (acao === 'regenerar') return regenerarSemana(i);
        renderizar();
      };
    });
    // Edição inline: campo vira editável e salva ao sair
    modal.querySelectorAll('[data-editavel]').forEach((el) => {
      el.onclick = () => {
        if (el.querySelector('input')) return;
        const campo = el.dataset.campo;
        const i = Number(el.dataset.indice);
        const atual = semanas[i][campo] ?? '';
        const input = document.createElement('input');
        input.value = atual;
        input.type = campo === 'estimatedHours' ? 'number' : 'text';
        input.style.cssText = 'width:100%;background:#1A2130;border:1px solid #60A5FA;border-radius:6px;color:#fff;padding:4px 8px;font:inherit;';
        el.textContent = '';
        el.appendChild(input);
        input.focus();
        input.select();
        const confirmar = () => {
          semanas[i][campo] = campo === 'estimatedHours' ? (Number(input.value) || 0) : input.value.slice(0, 200);
          renderizar();
        };
        input.onblur = confirmar;
        input.onkeydown = (ev) => { if (ev.key === 'Enter') input.blur(); if (ev.key === 'Escape') { input.onblur = null; renderizar(); } };
      };
    });
  }

  function linhaSemana(sem, i) {
    return `<div style="display:flex;gap:10px;align-items:center;background:#1A2130;border-radius:10px;padding:10px 12px;margin-bottom:8px;">
      <span style="min-width:52px;color:#60A5FA;font-weight:700;">Sem ${sem.week ?? i+1}</span>
      <span data-editavel data-campo="topic" data-indice="${i}" style="flex:1;cursor:pointer;">${sem.topic || '—'}</span>
      <span data-editavel data-campo="focus" data-indice="${i}" style="flex:1;color:#9E9E9E;cursor:pointer;">${sem.focus || '—'}</span>
      <span data-editavel data-campo="estimatedHours" data-indice="${i}" style="min-width:56px;text-align:right;cursor:pointer;color:#60A5FA;">${sem.estimatedHours ?? 0}h</span>
      <span style="display:flex;gap:2px;">
        <button data-acao="subir" data-indice="${i}" title="Subir" style="background:none;border:none;color:#9E9E9E;cursor:pointer;">↑</button>
        <button data-acao="descer" data-indice="${i}" title="Descer" style="background:none;border:none;color:#9E9E9E;cursor:pointer;">↓</button>
        <button data-acao="regenerar" data-indice="${i}" title="Regenerar com IA" style="background:none;border:none;color:#60A5FA;cursor:pointer;">⟳</button>
        <button data-acao="excluir" data-indice="${i}" title="Excluir" style="background:none;border:none;color:#ff6b6b;cursor:pointer;">✕</button>
      </span>
    </div>`;
  }

  async function regenerarSemana(i) {
    const status = document.getElementById('status-cronograma');
    if (status) { status.style.color = '#60A5FA'; status.textContent = 'Regenerando semana ' + semanas[i].week + '...'; }
    try {
      const r = await fetch('/api/cronograma/regenerar-semana', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          week: semanas[i].week,
          weakSubjects: [], // opcional: passe as matérias fracas do onboarding aqui
          upcomingExams: []
        })
      });
      const nova = await r.json();
      if (!nova.erro) semanas[i] = nova;
    } catch (e) {}
    if (status) { status.style.color = '#1DB954'; status.textContent = 'Semana atualizada!'; }
    renderizar();
  }

  function adicionarSemana() {
    const proximo = Math.max(0, ...semanas.map((s) => Number(s.week) || 0)) + 1;
    semanas.push({ week: proximo, topic: '', focus: '', estimatedHours: 0 });
    renderizar();
  }

  async function salvar() {
    const status = document.getElementById('status-cronograma');
    if (status) { status.style.color = '#60A5FA'; status.textContent = 'Salvando...'; }
    try {
      localStorage.setItem('cronograma_semanas_salvas', JSON.stringify(semanas));
    } catch (_) {}
    try {
      const headers = { 'Content-Type': 'application/json' };
      try {
        const sessao = localStorage.getItem('vestibularpro_session_user');
        if (sessao) {
          const u = JSON.parse(sessao);
          if (u.uid) headers['x-usuario-id'] = u.uid;
        }
      } catch (_) {}
      const r = await fetch('/api/cronograma', {
        method: 'POST',
        headers,
        body: JSON.stringify({ cronograma: semanas })
      });
      const d = await r.json();
      if (status) {
        status.style.color = d.sucesso ? '#1DB954' : '#ff6b6b';
        status.textContent = d.sucesso ? 'Salvo!' : (d.erro || 'Erro ao salvar.');
      }
    } catch (e) {
      if (status) { status.style.color = '#1DB954'; status.textContent = 'Salvo localmente!'; }
    }
  }

  // Botão que abre o cronograma: adicione no HTML do app
  function abrir() {
    window.dispatchEvent(new CustomEvent('abrir-cronograma-macro'));
    const btnAba = document.getElementById('btn-abrir-cronograma');
    if (btnAba) {
      btnAba.click();
    } else {
      carregarOuGerar();
    }
  }

  return { abrir, adicionarSemana, salvar };
})();
</script>

   SIMULADOS PERSONALIZADOS — gabarita

   Questões com figura recebem imagem gerada pelo servidor.
   ============================================================ */
window.Simulado = (() => {
  let atual = null;      // simulado em andamento
  let respostas = {};    // id da questão -> alternativa escolhida
  let finalizado = false;
  let nivelEscolhido = 'media';

  function esc(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');

  function authHeaders() {

  function mostrarAviso(texto) {

        </select>
        <label style="display:block;font-size:13px;color:#9E9E9E;margin:10px 0 4px;">Dificuldade</label>
        <div id="sim-niveis" style="display:flex;gap:8px;">

        <input id="sim-num" type="range" min="5" max="45" step="5" value="10" style="width:100%;accent-color:#60A5FA;">
        <div style="display:flex;justify-content:space-between;font-size:11px;color:#9E9E9E;"><span>5</span><span>45</span></div>
        <button id="sim-gerar" type="button" onclick="Simulado.gerar()"
          style="width:100%;margin-top:18px;padding:14px;border:none;border-radius:10px;background:#1E3A8A;color:#fff;font-weight:700;cursor:pointer;font-size:15px;">

        </button>
        <p style="color:#6B7280;font-size:12px;margin:10px 0 0;">⏱️ A geração das questões e das imagens pode levar até 2–3 minutos.</p>
      </div>`;
    m.style.display = 'flex';

          x.style.cssText = 'flex:1;padding:10px;border-radius:8px;cursor:pointer;background:none;color:#9E9E9E;border:1px solid #2A3345;';
        });
        b.style.cssText = 'flex:1;padding:10px;border-radius:8px;cursor:pointer;background:#1E3A8A;color:#fff;border:none;';
        b.dataset.selecionado = '1';
        nivelEscolhido = b.dataset.nivel || 'media';
      };
    });
  }

  async function gerar() {
    const m = modal();
    mostrarAviso('');
    const nivelBtn = m.querySelector('#sim-niveis button[data-selecionado]');
    nivelEscolhido = nivelBtn ? nivelBtn.dataset.nivel : 'media';
    const payload = {
      vestibular: document.getElementById('sim-vestibular')?.value || 'ENEM',
      materia: document.getElementById('sim-materia')?.value || 'Matemática',
      dificuldade: nivelEscolhido,
      numQuestoes: Number(document.getElementById('sim-num')?.value) || 10,
    };
    const btn = document.getElementById('sim-gerar');
    if (btn) {
      btn.disabled = true;
      btn.textContent = '⏳ Gerando questões e imagens...';
    }
    try {
      const r = await fetch('/api/simulado/criar', {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify(payload),
      });
      const d = await r.json();
      if (!r.ok || d.erro || !d.simulado) {
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Gerar simulado';
        }
        return mostrarAviso(d.erro || 'Não foi possível gerar o simulado.');
      }
      atual = d.simulado;
      respostas = {};
      finalizado = false;
      renderizarProva();
    } catch (e) {
      if (btn) {
        btn.disabled = false;
        btn.textContent = 'Gerar simulado';
      }
      mostrarAviso('Erro de conexão. Tente novamente.');
    }
  }

  function renderizarProva() {
    const m = modal();
    const cardAnterior = document.getElementById('sim-card');
    const scrollPos = cardAnterior ? cardAnterior.scrollTop : 0;
    const cabecalho = finalizado ? resultadoHTML() : '';
    m.innerHTML = `
      <div id="sim-card" style="background:#10141D;color:#fff;border:1px solid #1E2534;border-radius:16px;max-width:760px;width:100%;max-height:92vh;overflow-y:auto;padding:24px;">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;">
          <h2 style="font-size:18px;margin:0;">${esc(atual.vestibular)} · ${esc(atual.materia)}
            <span style="color:#60A5FA;font-size:13px;">· ${esc(NIVEIS[atual.dificuldade] || 'Média')}
            · ${atual.questoes.length} questões</span></h2>
          <button type="button" onclick="Simulado.fechar()" style="background:none;border:none;color:#9E9E9E;font-size:22px;cursor:pointer;">✕</button>
        </div>
        <div id="sim-aviso" style="display:none;background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.4);color:#ff8787;padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:12px;"></div>
        ${cabecalho}
        <div id="sim-questoes">${atual.questoes.map(questaoHTML).join('')}</div>
        <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;">
          ${finalizado
            ? `<button type="button" onclick="Simulado.abrirFormulario()" style="padding:12px 20px;border:none;border-radius:10px;background:#1E3A8A;color:#fff;font-weight:600;cursor:pointer;">Criar outro simulado</button>`
            : `<button type="button" onclick="Simulado.finalizar()" style="padding:12px 20px;border:none;border-radius:10px;background:#1DB954;color:#10141D;font-weight:700;cursor:pointer;">Corrigir simulado</button>
               <span id="sim-contagem" style="align-self:center;color:#9E9E9E;font-size:13px;"></span>`}
        </div>
      </div>`;
    m.style.display = 'flex';
    const novoCard = document.getElementById('sim-card');
    if (novoCard && scrollPos > 0) novoCard.scrollTop = scrollPos;
    m.querySelectorAll('[data-qid][data-op]').forEach((el) => {
      el.onclick = () => escolher(el.dataset.qid, Number(el.dataset.op));
    });
    atualizarContagem();
  }

  function questaoHTML(q, i) {
    const letra = ['A','B','C','D','E'];
    const imagem = q.image
      ? `<img src="${esc(q.image)}" alt="Figura da questão ${i+1}"
          style="width:100%;max-height:320px;object-fit:contain;border-radius:10px;margin:10px 0;background:#fff;">`
      : (q.imagem_descricao
          ? `<div style="background:#10141D;border:1px dashed #2A3345;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:12px;color:#9E9E9E;">
              <strong style="color:#60A5FA;">Figura descritiva:</strong> ${esc(q.imagem_descricao)}
            </div>`
          : '');
    const opcoes = (q.options || []).map((op, j) => {
      const escolhida = respostas[q.id] === j;
      const correta = finalizado && j === q.correctAnswer;
      const erradaEscolhida = finalizado && escolhida && j !== q.correctAnswer;
      const estilo = correta ? 'border:1px solid #1DB954;background:rgba(29,185,84,.12);'
        : erradaEscolhida ? 'border:1px solid #ff6b6b;background:rgba(255,107,107,.10);'
        : escolhida ? 'border:1px solid #60A5FA;background:rgba(96,165,250,.10);'
        : 'border:1px solid #2A3345;';
      return `<div data-op="${j}" data-qid="${esc(q.id)}"
        style="display:flex;gap:10px;padding:10px 12px;border-radius:10px;margin:6px 0;cursor:pointer;${estilo}">
        <b style="color:#60A5FA;">${letra[j] || j + 1})</b><span>${esc(op)}</span></div>`;
    }).join('');
    const resolucao = finalizado ? `<p style="font-size:13px;color:#9E9E9E;margin:8px 0 0;line-height:1.5;">
      <b style="color:#1DB954;">✅ Resolução:</b> ${esc(q.explanation)}</p>` : '';
    return `<div style="background:#1A2130;border-radius:12px;padding:16px;margin-bottom:12px;">
      <p style="font-size:12px;color:#60A5FA;margin:0 0 6px;">Questão ${i+1} · ${esc(q.topic || q.subject)}</p>
      <p style="margin:0;line-height:1.5;white-space:pre-line;">${esc(q.text)}</p>
      ${imagem}${opcoes}${resolucao}</div>`;
  }

  function escolher(qid, op) {
    if (finalizado) return;
    respostas[qid] = op;
    renderizarProva();
  }

  function atualizarContagem() {
    const el = document.getElementById('sim-contagem');
    if (el && atual) el.textContent = `${Object.keys(respostas).length}/${atual.questoes.length} respondidas`;
  }

  async function finalizar() {
    if (!atual) return;
    if (Object.keys(respostas).length < atual.questoes.length) {
      const faltando = atual.questoes.length - Object.keys(respostas).length;
      mostrarAviso(`Responda as ${faltando} ${faltando === 1 ? 'questão que falta' : 'questões que faltam'} antes de corrigir.`);
      const card = document.getElementById('sim-card');
      if (card) card.scrollTop = 0;
      return;
    }
    mostrarAviso('');
    try {
      const r = await fetch(`/api/simulado/${encodeURIComponent(atual.id)}/finalizar`, {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ respostas: Object.entries(respostas).map(([id, escolha]) => ({ id, escolha })) }),
      });
      const d = await r.json();
      if (!r.ok || d.erro) return mostrarAviso(d.erro || 'Erro ao registrar resultado.');
    } catch (e) {}
    finalizado = true;
    renderizarProva();
    const card = document.getElementById('sim-card');
    if (card) card.scrollTop = 0;
  }

  function resultadoHTML() {
    const acertos = atual.questoes.filter((q) => respostas[q.id] === q.correctAnswer).length;
    const total = Math.max(1, atual.questoes.length);
    const pct = Math.round((acertos / total) * 100);
    return `<div style="background:#1A2130;border-radius:12px;padding:16px;margin-bottom:14px;text-align:center;">
      <span style="font-size:30px;font-weight:800;color:${pct >= 70 ? '#1DB954' : pct >= 50 ? '#60A5FA' : '#ff6b6b'};">${pct}%</span>
      <p style="margin:4px 0 0;color:#9E9E9E;font-size:13px;">${acertos} de ${atual.questoes.length} questões corretas</p>
    </div>`;
  }

  function fechar() { modal().style.display = 'none'; }

  return { abrirFormulario, gerar, escolher, finalizar, fechar };
})();
</script>

</html>
